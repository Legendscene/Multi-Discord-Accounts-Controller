<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f111a"/>
      <stop offset="0.5" stop-color="#181b2a"/>
      <stop offset="1" stop-color="#10121d"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5865F2"/>
      <stop offset="0.5" stop-color="#57F287"/>
      <stop offset="1" stop-color="#FEE75C"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5865F2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#57F287" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20" y="-20" width="940" height="300" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bgGradient)"/>
  <rect x="1" y="1" width="898" height="258" rx="15" stroke="url(#cardGlow)" stroke-width="1.5"/>

