  </g>

  <!-- Title & Subtitle -->
  <text x="160" y="86" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
    Multi Discord Accounts Controller
  </text>
  <text x="160" y="114" fill="#949ba4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
